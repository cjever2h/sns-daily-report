<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  body { width: 330px; margin: 0; font: 13px/1.5 -apple-system, "Malgun Gothic", sans-serif; color: #1f2328; }
  header { background: #111; color: #fff; padding: 10px 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #ffb36b; font-weight: 400; font-size: 12px; text-decoration: none; }
  main { padding: 12px 14px; }
  label { display: block; font-size: 12px; color: #57606a; margin: 10px 0 4px; }
  input[type=text], input[type=time], input[type=number] { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #d0d7de; border-radius: 8px; font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  button { border: 0; border-radius: 8px; padding: 9px 10px; font-weight: 600; cursor: pointer; font-size: 13px; }
  .primary { background: #ff7a1a; color: #fff; width: 100%; margin-top: 12px; }
  .ghost { background: #f3f4f6; color: #1f2328; }
  .ok { color: #1a7f37; } .err { color: #cf222e; }
  #status { margin-top: 10px; padding: 8px; background: #f6f8fa; border-radius: 8px; min-height: 18px; }
  #logs { margin-top: 8px; max-height: 140px; overflow: auto; font-size: 11px; color: #57606a; white-space: pre-wrap; }
  .check { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
  small { color: #8c959f; }
</style>
</head>
<body>
<header>스레드 데일리 수집기 <a id="app" href="#" target="_blank">리포트 열기 ↗</a></header>
<main>
  <label>수집 키 (웹앱 → 설정에서 복사)</label>
  <div class="row"><input id="key" type="text" placeholder="xxxxxxxx-xxxx-..."><button id="save" class="ghost" style="flex:0 0 64px">저장</button></div>
  <div id="keyMsg"><small>키는 이 브라우저에만 저장됩니다.</small></div>

  <div class="check"><input id="autoOn" type="checkbox"><span>매일 자동 수집</span></div>
  <div class="row">
    <div><label>수집 시각</label><input id="autoTime" type="time"></div>
    <div><label>최근 며칠 글 갱신</label><input id="recheckDays" type="number" min="1" max="14"></div>
  </div>
  <small>브라우저가 켜져 있을 때 수집합니다. 그 시각에 꺼져 있었다면 켜진 뒤 30분 안에 따라잡습니다.</small>

  <button id="run" class="primary">지금 수집하기</button>
  <button id="backfill" class="ghost" style="width:100%;margin-top:6px">과거 글 가져오기 (최근 60일, 한 번에 80개씩)</button>
  <small>글이 많으면 몇 분 뒤 다시 눌러 주세요. 이미 가져온 글은 건너뛰고 이어서 가져옵니다.</small>

  <div id="status">-</div>
  <div id="logs"></div>
</main>
<script src="popup.js"></script>
</body>
</html>
